name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Test and score
    # One job, on one platform: goldens are rasterised, so a golden rendered
    # elsewhere would fail on pixels nobody changed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter pub get --directory example

      # Formatting and the package's own analysis are part of pana's static
      # analysis score below; the example is not, so it is checked here.
      - name: Analyze the example
        run: flutter analyze
        working-directory: example

      - name: Test
        run: flutter test --coverage

      - name: Test the example
        run: flutter test
        working-directory: example

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: test/failures/

      # Scores the package the way pub.dev does — publish readiness, docs,
      # platform support, static analysis and dependency freshness — and fails
      # on any point lost.
      - name: Score with pana
        run: |
          dart pub global activate pana
          pana --no-warning --exit-code-threshold 0

      - uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
        continue-on-error: true
